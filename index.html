<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Wild California has moved</title>

    <!-- tells browsers to go, and search engines which address is canonical -->
    <meta http-equiv="refresh" content="0; url=https://wildcalifornia.github.io/" />
    <link rel="canonical" href="https://wildcalifornia.github.io/" />
    <meta name="robots" content="noindex" />

    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #fff9f5;
            color: #012b1c;
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            text-align: center;
        }

        main { max-width: 420px; }

        img { width: 76px; height: 76px; }

        h1 { margin: 18px 0 10px; font-size: 1.6rem; }

        p { margin: 0 0 22px; line-height: 1.6; color: #3d5a4b; }

        a.go {
            display: inline-block;
            padding: 13px 28px;
            font-size: 1rem;
            font-weight: 700;
            color: #fff9f5;
            background: #012b1c;
            border-radius: 999px;
            text-decoration: none;
        }

        a.go:hover { background: #024430; }
    </style>

</head>

<body>

    <main>

        <img src="icon-192.png" alt="" />

        <h1>Wild California has moved</h1>

        <p>
            This project now lives at
            <strong>wildcalifornia.github.io</strong>.
            You should be sent there automatically.
        </p>

        <a class="go" href="https://wildcalifornia.github.io/">Go to Wild California</a>

    </main>

    <!-- replace rather than assign, so Back does not bounce you here again -->
    <script>location.replace('https://wildcalifornia.github.io/');</script>

</body>

</html>
